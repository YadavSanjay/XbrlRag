  # =========================================================================
  # SECTION 8 — MULTI-DIMENSIONAL FACTS
  # Axis matching is on the *local name* (namespace-insensitive): WS-1/A2 found
  # date-stamped namespace drift, not renames, to be the dominant real failure.
  # `require_unique` is essential here — the same (concept, dimensions) pair recurs
  # across comparative periods, so without it the ground truth would be ambiguous.
  # =========================================================================
  - id: aq-8b-multidim-lookup
    source: "analyst_queries.sql#8b"
    kind: dimensional
    tags: [multidim, dimensional, novel-generated]
    nl:
      - "For {company} in fiscal {fy}, what was {concept_label} for {dim_label}?"
      - "What did {company} report for {concept_label} under {dim_label} in FY{fy}?"
    params:
      ticker: corpus.tickers
      fy: corpus.fiscal_years
      combo:
        from_sql: |
          SELECT m.concept_label || ' :: ' || m.dim_label
          FROM (
            SELECT DISTINCT
                   regexp_replace(mm.concept, '^.*:', '')            AS concept_label,
                   (SELECT string_agg(v, ' and ' ORDER BY v)
                      FROM jsonb_each_text(mm.dimension_labels) AS t(k, v))
                                                                     AS dim_label,
                   count(*) OVER (PARTITION BY mm.concept, mm.dimension_labels) AS n
            FROM   mv_financial_facts_multidim mm
            JOIN   entity_master em ON em.cik = mm.cik
            WHERE  em.trading_symbol = %(ticker)s AND mm.fiscal_year = %(fy)s
              AND  mm.unit = 'USD' AND mm.dimension_count >= 2
              AND  mm.is_current_period AND mm.fiscal_period = 'FY'
              -- Only concepts the `lookup` op can actually reach: it resolves
              -- through concept_family, so a fact whose concept has no mapping
              -- is unanswerable by design. 34 of 40 cases were such facts, and
              -- the template was asking questions the architecture cannot answer.
              AND  EXISTS (SELECT 1 FROM concept_mapping cm
                            WHERE regexp_replace(cm.qname, '^.*:', '')
                                = regexp_replace(mm.concept, '^.*:', '')
                              AND COALESCE(cm.is_deprecated, FALSE) = FALSE)
          ) m
          WHERE m.n = 1 AND m.dim_label IS NOT NULL
          ORDER BY 1
          LIMIT 40
    sql: |
      SELECT mm.value, mm.fact_id, mm.unit
      FROM   mv_financial_facts_multidim mm
      JOIN   entity_master em ON em.cik = mm.cik
      WHERE  em.trading_symbol = %(ticker)s AND mm.fiscal_year = %(fy)s
        AND  mm.unit = 'USD' AND mm.dimension_count >= 2
        AND  mm.is_current_period AND mm.fiscal_period = 'FY'
        AND  regexp_replace(mm.concept, '^.*:', '') = split_part(%(combo)s, ' :: ', 1)
        AND  (SELECT string_agg(v, ' and ' ORDER BY v)
                FROM jsonb_each_text(mm.dimension_labels) AS t(k, v))
             = split_part(%(combo)s, ' :: ', 2)
    require_unique: true
    expect: {value: value, fact_ids: fact_id, unit: unit}
    rel_tol: 1.0e-4

  # =========================================================================
  # SECTION 10 — IFRS / 20-F FILER (TSM), reported in TWD.
  # Keeps unit-handling regressions visible: TSM tags both TWD and USD facts, and
  # a query that silently returns the wrong currency is a silent-wrong answer.
  # =========================================================================
  - id: aq-10a-tsm-twd-lookup
    source: "analyst_queries.sql#10a"
    kind: lookup
    max_per_stratum: 6      # TSM is the only 20-F filer; keep its unit coverage
    tags: [ifrs, twd, currency, tsm, novel-generated]
    nl:
      - "What was TSMC's {concept_label} in fiscal {fy}, in New Taiwan dollars?"
      - "Report TSMC's FY{fy} {concept_label} in TWD."
    params:
      fy: corpus.fiscal_years
      concept:
        values: [Revenue, GrossProfit, OperatingIncome, NetIncome,
                 CashFromOperations, Capex]
        labels:
          Revenue: revenue
          GrossProfit: gross profit
          OperatingIncome: operating income
          NetIncome: net income
          CashFromOperations: net cash from operating activities
          Capex: capital expenditure
    sql: |
      SELECT DISTINCT ON (cik) value, fact_id, unit
      FROM   mv_financial_facts
      WHERE  ticker = 'TSM' AND fiscal_year = %(fy)s
        AND  concept_family = %(concept)s AND unit = 'TWD'
        AND  segment_axis IS NULL AND period_type = 'duration'
        AND  is_canonical_filing
        AND  fiscal_period = 'FY' AND duration_kind = 'annual'
      ORDER  BY cik, period_end DESC, concept_pref_rank NULLS LAST, fact_id DESC
    expect: {value: value, fact_ids: fact_id, unit: unit}
    ticker: TSM
    rel_tol: 1.0e-4

  - id: aq-10b-tsm-geo-breakdown
    source: "analyst_queries.sql#10b"
    concept: Revenue
    kind: breakdown
    tags: [ifrs, geography, breakdown, tsm, novel-generated]
    nl:
      - "Break down TSMC's fiscal {fy} revenue by region."
      - "Which region contributed the most revenue to TSMC in FY{fy}?"
    params:
      fy: corpus.fiscal_years
    # "The breakdown" = the finest member set summing to the undimensioned total,
    # the same rule the pipeline's breakdown step uses (docs/specs/breakdown-op.md);
    # members in the total's (reporting) currency. No such set, no case.
    sql: |
      WITH t AS (
        SELECT f.cik, f.value, f.unit
        FROM   mv_financial_facts f
        WHERE  f.ticker = 'TSM' AND f.fiscal_year = %(fy)s
          AND  f.concept_family = 'Revenue' AND f.segment_axis IS NULL
          AND  f.period_type = 'duration' AND f.is_canonical_filing AND f.is_current_period
          AND  f.fiscal_period = 'FY' AND f.duration_kind = 'annual'
        ORDER  BY f.period_end DESC,
               NOT EXISTS (
                 SELECT 1 FROM mv_financial_facts p
                  WHERE p.cik = f.cik AND p.fiscal_year = f.fiscal_year
                    AND p.concept_family = f.concept_family AND p.unit = f.unit
                    AND p.segment_axis IS NULL AND p.period_end < f.period_end
               ),
               f.concept_pref_rank ASC NULLS LAST, f.fact_id DESC
        LIMIT  1
      )
      SELECT COALESCE(m.segment_label, regexp_replace(g.geo_member, '^.*:', '')) AS geo_name,
             g.value, g.fact_id,
             t.value AS total
      FROM   mv_geographic_facts g
      JOIN   t ON g.cik = t.cik AND g.unit IS NOT DISTINCT FROM t.unit
      JOIN   mv_financial_facts m ON m.fact_id = g.fact_id
                                 AND NOT COALESCE(m.has_multiple_dimensions, FALSE)
      WHERE  g.fiscal_year = %(fy)s AND g.concept_family = 'Revenue'
        AND  g.fiscal_period = 'FY' AND g.duration_kind = 'annual'
      ORDER  BY g.value DESC, g.fact_id
    expect: {rows: {entity: geo_name, value: value}, fact_ids: fact_id, total: total}
    ticker: TSM
    min_rows: 2
    rel_tol: 1.0e-4
