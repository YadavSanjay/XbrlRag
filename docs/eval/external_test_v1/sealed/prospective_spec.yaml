  - id: aq-7b-margin-screen
    source: "analyst_queries.sql#7b"
    kind: screen
    max_per_stratum: 4      # all four metrics per year (stratum = fiscal year)
    tags: [ratio, profitability, cross-filer, screen, domain-relevant]
    nl:
      - "List the top 5 covered companies by {metric_label} in fiscal {fy}, ranked highest first."
      - "Rank the 5 covered filers with the highest {metric_label} for FY{fy}."
    params:
      fy: corpus.fiscal_years
