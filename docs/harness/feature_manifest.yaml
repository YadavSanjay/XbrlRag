  # ===================== WS-9 · Evaluation & Benchmarking =====================
  # Design: docs/design/XbrlRag_Evaluation.md
  # Extends WS-2's 13-case golden spine into a corpus-scale, durable, inspectable
  # benchmark. E1-E4 are the approved plan (phases 0-2); E5/E6 are designed but
  # deliberately unscheduled (system arms / external benchmarks).
  - id: WS9-E1
    title: Eval core framework (EvalCase / SystemUnderTest / runner / screen+citation graders)
    workstream: WS-9
    finding: E1
    status: done
    checks:
      - path: src/eval/core/case.py
      - path: src/eval/core/system.py
      - path: src/eval/core/runner.py
      - path: src/eval/core/graders/screen.py
      - path: src/eval/core/graders/citation.py
      - path: src/eval/systems/xbrlrag_full.py
      # Narrative must stay serialized: the reranker is CPU-bound (90-145s/query)
      # and has segfaulted under unbounded batching.
      - contains: { file: src/eval/core/runner.py, pattern: "DEFAULT_KIND_CONCURRENCY" }
      # WS-2 importers (golden grader, integration conftest) must keep working.
      - contains: { file: src/eval/xbrl/numeric.py, pattern: "from src.eval.core.graders.numeric import" }

  - id: WS9-E2
    title: SQL-derived ground-truth suite generated from analyst_queries.sql
    workstream: WS-9
    finding: E2
    status: done
    checks:
      - path: configs/eval/sql_derived_templates.yaml
      - path: scripts/eval/build_sql_derived_suite.py
      - path: scripts/eval/run_suite.py
      - path: src/eval/suites/sql_derived.py
      - path: test/eval/suites/sql_derived_v1.json
      # Ambiguous or unlabelled ground truth must be dropped, never shipped.
      - contains: { file: src/eval/suites/sql_derived.py, pattern: "skipped_ambiguous" }
      - contains: { file: src/eval/suites/sql_derived.py, pattern: "skipped_no_facts" }
      # Suite-content invariants (>=250 cases, fact ids on every case, no [Member]
      # leakage, unique ids) are asserted by TestCommittedSuite in the normal suite.
      # NB: no `cmd:` check here — it would shell out with a bare `python` (base env,
      # no project deps) and run pytest recursively from inside pytest.
      - path: test/unit/test_sql_derived_suite.py
      - contains:
          file: test/unit/test_sql_derived_suite.py
          pattern: "ws9_e2_acceptance_size"

  - id: WS9-E3
    title: Eval result persistence (`eval` schema + store)
    workstream: WS-9
    finding: E3
    status: done
    checks:
      - path: scripts/ddl/eval/eval_runs.sql
      - path: src/eval/core/store.py
      # Postgres rejects U+0000 in text and jsonb; because persistence is atomic and
      # fail-soft, one stray byte silently discarded an entire 407-case run.
      - contains: { file: src/eval/core/store.py, pattern: "def _scrub" }
      - path: test/unit/test_eval_store_api.py
      - contains:
          file: test/unit/test_eval_store_api.py
          pattern: "test_persisting_an_answer_containing_nul_succeeds"

  - id: WS9-E4
