# XbrlRag feature / scope manifest — machine-checkable half of WS-8 / H5.
#
# Every material feature in the 8-workstream plan
# (docs/design/README.md lists the design docs; this manifest is the status) as a per-item TESTABLE entry:
# a `check` that proves the feature is really built. Each check STARTS FAILING
# and only passes once the artifact exists — so "done" is externally verifiable,
# not the agent's say-so.
#
# Run:  python scripts/harness/check_features.py            # report
#       python scripts/harness/check_features.py --gate     # fail on scope drift
#
# Contract enforced by --gate:
#   status: done  + check FAILS  -> gate fails (claimed feature is not real)
#   status: todo  + check PASSES -> warning (flip it to done)
#
# status ∈ {done, partial, todo, deferred}.  check types: path | absent |
# contains{file,pattern} | cmd.  `manual: <note>` = no automated check (excluded
# from the gate).  VISION.md is the human-readable scope doc this pairs with.

features:
  # ===================== WS-1 · Data Integrity & Trust Gates =====================
  - id: WS1-A1
    title: Four data-integrity gate materialized views (anchor / calc-network / sum-of-parts / completeness)
    workstream: WS-1
    finding: A1
    status: done
    checks:
      - path: scripts/ddl/mv/05_mv_anchor_coverage.sql
      - path: scripts/ddl/mv/12_mv_calculation_network.sql
      - path: scripts/ddl/mv/40_mv_sum_of_parts_checks.sql
      - path: scripts/ddl/mv/41_mv_filing_completeness.sql

  - id: WS1-B5
    title: Gated staging→prod publish (publish_manifest + promotion.py + read-time deny-list)
    workstream: WS-1
    finding: B5
    status: done
    checks:
      - path: src/ingest/sec_edgar/xbrl/promotion.py
      - path: scripts/ddl/layer_0/publish_manifest.sql

  - id: WS1-A4
    title: Hierarchy-aware mv_segment_matrix pct_of_axis_total + duplicate-member dedupe
    workstream: WS-1
    finding: A4
    status: todo
    # Found 2026-08 while building the WS-9 SQL-derived suite: a filer tagging both an
    # aggregate and its children on one axis double-counts the percentage denominator
    # (AAPL Product renders 37.7% vs ~75% actual), and AAPL FY2024 duplicates
    # `Service [Member]`. See docs/design/XbrlRag_Materialized_Views.md §8.
    checks:
      - contains:
          file: scripts/ddl/mv/31_mv_segment_matrix.sql
          pattern: "is_aggregate"

  - id: WS1-A2
    title: Namespace-insensitive YoY match + member-alias reclassification
    workstream: WS-1
    finding: A2
    status: done
    checks:
      - path: src/ingest/sec_edgar/xbrl/member_alias_detector.py
      - path: scripts/ddl/layer_0/member_aliases.sql

