      - path: ui/src/pages/technical/EvalPage.tsx
      - path: ui/src/pages/technical/EvalRunPage.tsx
      - path: ui/src/pages/technical/EvalComparePage.tsx
      # A failing case must drill into its full existing trace.
      - contains: { file: ui/src/pages/technical/EvalRunPage.tsx, pattern: "/tech/traces/" }
      - contains: { file: ui/src/App.tsx, pattern: "/tech/eval" }

