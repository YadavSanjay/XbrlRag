# Sector tags per filer: GICS sector and a reviewed short industry label
# (docs/specs/sector-tags.md). Loaded and validated by
# src/retriever/xbrl/entity_sectors.py (load_sector_tags); written into entity_master by
# `python -m src.ingest.sec_edgar.ingest.sector_tags`.
#
# Scope: the development universe only — the corpus filers and the v2 wave-1 filers
# (configs/eval/v2/heldout_exclusions.yaml). The held-out filers, their alternates and every
# other candidate in docs/eval/heldout_v2/heldout_v2_pool.json are NEVER added here.
#
# Rules:
#   - cik is the ten-digit SEC EDGAR CIK, quoted.
#   - gics_sector is one of the eleven GICS sector names, exactly. For a filer on the
#     committed S&P 100 list it is the list's sector; for any other filer it is set by hand
#     and the entry carries a `note` saying where it comes from.
#   - industry is a reviewed short label, not a GICS sub-industry name. Groups in
#     configs/eval/v2/groups.yaml select on it, so a label change regroups filers:
#     "Retail" spans GICS's Consumer Discretionary and Consumer Staples Distribution &
#     Retail industry groups (AMZN, HD; WMT, COST); MCD is a restaurant, not a retailer.

