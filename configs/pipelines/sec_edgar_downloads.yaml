# SEC EDGAR download configuration
#
# Run:  python -m src.ingest.sec_edgar.downloader --config configs/pipelines/sec_edgar_downloads.yaml
#
# Supported filing_type values: "10-K", "10-Q", "20-F"
#   10-K / 20-F  — annual filings; no quarter field.
#   10-Q         — quarterly filings; quarter: 1 | 2 | 3 required (the FISCAL quarter).
#   fiscal_year is the calendar year in which the filer's fiscal year ends, for every form.
#
# Files land under:
#   <output_root>/<TICKER>/<FY>/10-K/<files>            # 10-K (original)
#   <output_root>/<TICKER>/<FY>/10-K_A/<files>          # 10-K/A (amendment; "/" -> "_")
#   <output_root>/<TICKER>/<FY>/20-F/<files>            # 20-F (original; FPI annual)
#   <output_root>/<TICKER>/<FY>/20-F_A/<files>          # 20-F/A (amendment)
#   <output_root>/<TICKER>/<FY>/10-Q/Q<n>/<files>       # 10-Q (original)
#   <output_root>/<TICKER>/<FY>/10-Q_A/Q<n>/<files>     # 10-Q/A (amendment)
#
# If the latest matching filing on EDGAR is an amendment, it is downloaded
# automatically with is_amendment: true recorded in manifest.yaml.
#
# 20-F notes:
#   - TSM (TSMC) is a Foreign Private Issuer; it files a 20-F under IFRS.
#   - IFRS taxonomy uses ifrs-full:* concept QNames instead of us-gaap:*.
#   - The concept_mapping table must have IFRS rows (source='ifrs') for the
#     resolver to find facts from 20-F filings.
#   - See docs/design/XbrlRag_Materialized_Views.md §7 (IFRS / 20-F).

# SEC EDGAR requires a contactable "Name email@domain" User-Agent. Intentionally EMPTY:
# set SEC_EDGAR_IDENTITY in .env (it wins over this key, as does --identity). With none
# of the three set, the downloader fails at startup.
identity:
# Intentionally EMPTY — SEC_EDGAR_ROOT wins over this key, and with neither set
# the local-dev default in src/ingest/sec_edgar/storage.py applies. Do not put an
# absolute Windows path here: it is a *relative* path on POSIX, so in a container
# it writes to /app/D:/... instead of the mounted root.
output_root:

