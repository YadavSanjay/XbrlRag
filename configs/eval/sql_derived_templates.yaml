  # =========================================================================
  # SECTION 5 — BALANCE SHEET
  # =========================================================================
  - id: aq-5a-balance-sheet-lookup
    source: "analyst_queries.sql#5a"
    kind: lookup
    tags: [balance-sheet, metrics-generated]
    nl:
      - "What were {company}'s {concept_label} at the end of fiscal {fy}?"
      - "Report {company}'s {concept_label} as of the FY{fy} balance sheet date."
      - "{company} {concept_label} at FY{fy} year-end?"
    params:
      ticker: corpus.tickers
      fy: corpus.fiscal_years
      concept:
        values: [TotalAssets, TotalLiabilities, CashAndEquivalents, Inventory,
                 Goodwill, RetainedEarnings, CurrentAssets, CurrentLiabilities]
        labels:
          TotalAssets: total assets
          TotalLiabilities: total liabilities
          CashAndEquivalents: cash and cash equivalents
          Inventory: inventory
          Goodwill: goodwill
          RetainedEarnings: retained earnings
          CurrentAssets: total current assets
          CurrentLiabilities: total current liabilities
    # S1 pick as in aq-1a: the balance at the fy filing's own period end, as the latest
    # later-labelled canonical filing restates it; a 10-K that tags the balance only at
    # earlier dates has no case (docs/specs/suite-templates-s1.md).
    pick: s1_lookup
    sql: |
      SELECT f.value, f.fact_id, f.unit, f.cik, f.accession_no, f.fiscal_year,
             f.fiscal_period, f.filed_date, f.is_amendment, f.is_canonical_filing,
             f.document_period_end, f.concept, f.concept_family, f.segment_axis,
             f.segment_member, f.period_start, f.period_end, f.concept_role,
             f.concept_pref_rank, f.presented,
             (SELECT CASE WHEN x.is_decimals_infinity THEN NULL
                          ELSE x.decimals_value::int END
              FROM fact x WHERE x.fact_id = f.fact_id) AS decimals
      FROM   mv_financial_facts f
      WHERE  f.ticker = %(ticker)s AND f.concept_family = %(concept)s
        AND  f.segment_axis IS NULL AND f.period_type = 'instant'
    expect: {value: value, fact_ids: fact_id, unit: unit}
    rel_tol: 1.0e-4

  - id: aq-5b-total-assets-screen
    source: "analyst_queries.sql#5b"
    kind: screen
    tags: [balance-sheet, cross-filer, screen, domain-relevant]
    nl:
      - "List the top 5 covered companies by total assets in fiscal {fy}, ranked highest first."
      - "Rank the 5 largest covered filers by total assets for FY{fy}."
    params:
      fy: corpus.fiscal_years
    # The fact the screen cites (@LOOKUP_ORDER; docs/specs/screen-candidate-order.md).
    sql: |
      SELECT DISTINCT ON (f.ticker) f.ticker, f.value, f.fact_id
      FROM   mv_financial_facts f
      WHERE  f.concept_family = 'TotalAssets' AND f.fiscal_year = %(fy)s
        AND  f.period_type = 'instant' AND f.segment_axis IS NULL
        AND  f.is_canonical_filing AND f.unit = 'USD'
        AND  f.fiscal_period = 'FY'
        AND  @ANSWERABLE(f)
      ORDER  BY f.ticker, @LOOKUP_ORDER(f)
    post_sort: {by: value, order: desc}
    expect: {rows: {entity: ticker, value: value}, fact_ids: fact_id}
    top_n: 5
    min_rows: 3
    rel_tol: 1.0e-4

