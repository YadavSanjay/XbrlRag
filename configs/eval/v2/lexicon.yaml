metrics:
  # --- income statement
  Revenue:
    label: Revenues
    synonyms: [revenue, net sales, total revenue, sales, turnover]
    shorthand: [top line, rev]
  CostOfRevenue:
    label: Cost of Revenue
    synonyms: [cost of sales, cost of goods sold]
    shorthand: [COGS, COS]
  GrossProfit:
    label: Gross Profit
    synonyms: [gross profit dollars, gross margin dollars]
    shorthand: [GP]
  OperatingExpenses:
    label: Operating Expenses
    synonyms: [total operating expenses, operating costs]
    shorthand: [opex]
  ResearchAndDevelopment:
    label: Research and Development Expense
    synonyms: [R&D expense, research and development spending, R&D spend]
    shorthand: [R&D]
  SellingGeneralAndAdministrative:
    label: Selling, General and Administrative Expense
    synonyms: [SG&A expense, "selling, general and administrative expenses"]
    shorthand: [SG&A]
  SellingAndMarketing:
    label: Selling and Marketing Expense
    synonyms: [sales and marketing expense, sales and marketing spend]
    shorthand: [S&M]
  GeneralAndAdministrative:
    label: General and Administrative Expense
    synonyms: [G&A expense, general and administrative costs]
    shorthand: [G&A]
  RestructuringCharges:
    label: Restructuring Charges
    synonyms: [restructuring costs, restructuring expense]
  OperatingIncome:
    label: Operating Income (Loss)
    synonyms: [operating income, operating profit, income from operations]
    shorthand: [op income, OI]
  InterestExpense:
    label: Interest Expense
    synonyms: [interest expense]
  InterestIncome:
    label: Investment Income, Interest
    synonyms: [interest income, interest earned]
  OtherNonOperatingIncome:
    label: Other Nonoperating Income (Expense)
    synonyms: [other income (expense), other non-operating income (expense)]
  PretaxIncome:
    label: Income (Loss) from Continuing Operations before Income Taxes
    synonyms: [pretax income, income before income taxes, earnings before taxes]
    shorthand: [EBT, pre-tax profit]
  TaxExpense:
    label: Income Tax Expense (Benefit)
    synonyms: [income tax expense, provision for income taxes, tax expense]
    shorthand: [tax provision]
  EffectiveTaxRate:
    label: Effective Income Tax Rate Reconciliation, Percent
    synonyms: [effective tax rate, effective income tax rate]
    shorthand: [ETR]
  NetIncome:
    label: Net Income (Loss)
    synonyms: [net income, net earnings, net profit]
    shorthand: [bottom line, NI]
  NetIncomeToCommon:
    label: Net Income (Loss) Available to Common Stockholders, Basic
    synonyms: [net income available to common shareholders, net income attributable to common stockholders]
  ComprehensiveIncome:
    label: Comprehensive Income (Loss), Net of Tax
    synonyms: [comprehensive income, total comprehensive income]
  EarningsPerShareBasic:
    label: Earnings Per Share, Basic
    synonyms: [basic earnings per share, basic EPS]
  EarningsPerShareDiluted:
    label: Earnings Per Share, Diluted
    synonyms: [diluted earnings per share, diluted EPS]
    shorthand: [EPS]
  WeightedAverageSharesBasic:
    label: Weighted Average Number of Shares Outstanding, Basic
    synonyms: [basic weighted average shares outstanding, basic share count]
  WeightedAverageSharesDiluted:
    label: Weighted Average Number of Shares Outstanding, Diluted
    synonyms: [diluted weighted average shares outstanding, diluted share count]
  DividendsPerShare:
    label: Common Stock, Dividends, Per Share, Declared
    synonyms: [dividends declared per share, dividend per share]
    shorthand: [DPS]
  # --- balance sheet
  TotalAssets:
    label: Assets
    synonyms: [total assets]
  CurrentAssets:
    label: Assets, Current
    synonyms: [total current assets, current assets]
  CashAndEquivalents:
    label: Cash and Cash Equivalents, at Carrying Value
    synonyms: [cash and cash equivalents, cash and equivalents]
  ShortTermInvestments:
    label: Short-term Investments
    synonyms: [short-term investments, short-term marketable securities]
  AccountsReceivable:
    label: Accounts Receivable, after Allowance for Credit Loss, Current
    synonyms: [accounts receivable, trade receivables]
    shorthand: [A/R, AR]
  Inventory:
    label: Inventory, Net
    synonyms: [inventory, inventories]
  PropertyPlantAndEquipment:
    label: Property, Plant and Equipment, Net
    synonyms: ["net property, plant and equipment", net PP&E, net fixed assets]
    shorthand: [PP&E]
  Goodwill:
    label: Goodwill
    synonyms: [goodwill balance]
  IntangibleAssets:
    label: Intangible Assets, Net (Excluding Goodwill)
    synonyms: [intangible assets, net intangible assets]
    shorthand: [intangibles]
  TotalLiabilities:
    label: Liabilities
    synonyms: [total liabilities]
  CurrentLiabilities:
    label: Liabilities, Current
    synonyms: [total current liabilities, current liabilities]
  AccountsPayable:
    label: Accounts Payable, Current
    synonyms: [accounts payable, trade payables]
    shorthand: [A/P, AP]
  DeferredRevenue:
    label: Contract with Customer, Liability
    synonyms: [deferred revenue, total deferred revenue, unearned revenue, contract liabilities]
  Debt:
    label: Total Debt
    synonyms: [total debt, debt, total borrowings]
  StockholdersEquity:
    label: Stockholders' Equity Attributable to Parent
    synonyms: [stockholders' equity, shareholders' equity, book equity]
    shorthand: [equity]
  RetainedEarnings:
    label: Retained Earnings (Accumulated Deficit)
    synonyms: [retained earnings, accumulated earnings]
  SharesOutstanding:
    label: Common Stock, Shares, Outstanding
    synonyms: [shares outstanding, common shares outstanding]
    shorthand: [share count]
  # --- cash flow statement
  CashFromOperations:
    label: Net Cash Provided by (Used in) Operating Activities
    synonyms: [operating cash flow, cash from operations, cash flow from operating activities]
    shorthand: [CFO, OCF]
  CashFromInvesting:
    label: Net Cash Provided by (Used in) Investing Activities
    synonyms: [investing cash flow, cash flow from investing activities]
    shorthand: [CFI]
  CashFromFinancing:
    label: Net Cash Provided by (Used in) Financing Activities
    synonyms: [financing cash flow, cash flow from financing activities]
    shorthand: [CFF]
  Capex:
    label: Payments to Acquire Property, Plant, and Equipment
    synonyms: [capital expenditures, capital spending, purchases of property and equipment]
    shorthand: [capex]
  DepreciationAndAmortization:
    label: Depreciation, Depletion and Amortization
    synonyms: [depreciation and amortization, depreciation and amortization expense]
    shorthand: [D&A]
  ShareBasedCompensation:
    label: Share-based Payment Arrangement, Noncash Expense
    synonyms: [stock-based compensation, share-based compensation expense]
    shorthand: [SBC]
  StockRepurchases:
    label: Payments for Repurchase of Common Stock
    synonyms: [share repurchases, stock buybacks]
    shorthand: [buybacks]
  DividendsPaid:
    label: Payments of Dividends
    synonyms: [dividends paid, cash dividends paid]
  DebtIssued:
    label: Proceeds from Issuance of Debt
    synonyms: [proceeds from debt issuance, debt issued]
  DebtRepaid:
    label: Repayments of Long-Term Debt
    synonyms: [long-term debt repayments, repayments of long-term borrowings]
  # --- derived metrics (mv_derived_metrics; definitions per S4)
  GrossMarginPct:
    label: Gross Margin
    synonyms: [gross margin percentage, gross profit margin]
    shorthand: [GM]
  OperatingMarginPct:
    label: Operating Margin
    synonyms: [operating margin percentage, operating profit margin]
    shorthand: [op margin, OPM]
  NetMarginPct:
    label: Net Margin
    synonyms: [net profit margin, net income margin]
  EBITDA:
    label: EBITDA
    synonyms: ["earnings before interest, taxes, depreciation and amortization"]
  EBITDAMarginPct:
    label: EBITDA Margin
    synonyms: [EBITDA as a percentage of revenue]
  FreeCashFlow:
    label: Free Cash Flow
    synonyms: [free cash flow generation]
    shorthand: [FCF]
  FreeCashFlowMarginPct:
    label: Free Cash Flow Margin
    synonyms: [free cash flow as a percentage of revenue]
    shorthand: [FCF margin]
  RnDIntensityPct:
    label: R&D Intensity
    synonyms: [R&D as a percentage of revenue, research and development intensity]
  ReturnOnEquityPct:
    label: Return on Equity
    synonyms: [return on shareholders' equity]
    shorthand: [ROE]
  ReturnOnAssetsPct:
    label: Return on Assets
    synonyms: [return on total assets]
    shorthand: [ROA]
  ReturnOnInvestedCapitalPct:
    label: Return on Invested Capital
    synonyms: [return on capital]
    shorthand: [ROIC]
  CurrentRatio:
    label: Current Ratio
    synonyms: [ratio of current assets to current liabilities]
  QuickRatio:
    label: Quick Ratio
    synonyms: [acid-test ratio]
  DebtToEquity:
    label: Debt to Equity
    synonyms: [debt-to-equity ratio, leverage ratio]
    shorthand: [D/E]
  InterestCoverage:
    label: Interest Coverage
    synonyms: [interest coverage ratio, times interest earned]
  NetDebt:
    label: Net Debt
    synonyms: [debt net of cash]
  # --- S4 ratio definition ids: the ratio a compound rank_by_ratio question asks about
  # (docs/specs/compound-shape.md requirement 2). Keyed from their S4 inputs, never from a
  # derived-metric row; the main suites never phrase them.
  operating_margin:
    label: Operating Margin
    synonyms: [operating profit margin, operating margin percentage]
    shorthand: [op margin]
  net_margin:
    label: Net Margin
    synonyms: [net profit margin, net income margin]
  rd_intensity:
    label: R&D Intensity
    synonyms: [R&D as a share of revenue, research and development intensity]
    shorthand: [R&D/sales]
  current_ratio:
    label: Current Ratio
    synonyms: [ratio of current assets to current liabilities, working capital ratio]
    shorthand: [CA/CL]

