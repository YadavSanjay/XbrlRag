# v2 eval lexicon: the surface forms the phrasing renderer substitutes into
# configs/eval/v2/phrasebook.yaml. Loaded and validated by src/eval/suites/intents.py
# (load_lexicon); spec docs/specs/eval-intents.md.
#
# Scope: the dev filers in the corpus (v2 plan §4.1) and the wave-1 filers (§4.2), added
# with their ingest. The held-out filers (plan §4.3) are NEVER added to this file.
#
# Rules:
#   - Every surface string is non-empty and has no "{" or "}".
#   - A surface that contains a comma is quoted: unquoted, a flow list splits it in two.
#     scripts/eval/build_v2_suite.py fails on a phrasing two entries share or on a stray
#     one-word phrasing (src/eval/suites/intents.py check_lexicon_phrasings).
#   - The first phrase of a dimension or universe is the one rendered; further phrases are
#     reserved for a later phrasing axis.
#   - Metric ids are the fact store's canonical ids: the `concept_family` of
#     mv_financial_facts, or the `metric_name` of mv_derived_metrics for the derived ratios
#     (definitions in docs/design/XbrlRag_Eval_Semantics.md S4). `label` is the XBRL
#     standard label of the family's representative element (or the plain name of a derived
#     metric); `synonyms` are other names in common use; `shorthand` is analyst shorthand.
#   - period_ends are each filer's DocumentPeriodEndDate per DocumentFiscalYearFocus
#     (annual 10-K / 20-F filings only; S2: fiscal years are the filer's own labels).

