# Reviewed resolutions of statement disagreements. Specs: docs/specs/key-statement-witness.md
# (requirement 3) and docs/specs/reviewed-resolutions.md. This is the live list the v2 build
# reads. Each entry is either an ORIGINAL entry (equal, field for field, to an entry of the
# locked list test/spec/key-statement-witness/fixtures/key_resolutions.yaml) or a REVIEWED
# entry carrying a `review` record {by, date, bucket, evidence} whose `by` is a name of the
# reviewer allow-list configs/eval/v2/reviewers.yaml. An agent may draft an entry; only the
# maintainer marks it reviewed. The build checks this at runtime (check_resolutions, against
# the pinned original list key_resolutions.locked.yaml) and fails before any key is selected;
# it also refuses an entry that covers no blocked key.
#
# An entry covers exactly one key: its family, CIK, fiscal year, concept and value. A key the
# mapping later moves to another concept or value is not covered and blocks again.
#   reading  key: the key stands, for the stated reason; drop: the intent is not keyed.
version: 1
resolutions:

