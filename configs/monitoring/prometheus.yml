# Prometheus scrape + alerting config for the XbrlRag XBRL metrics exporter (WS-7 / B8).
#
# The exporter (src/observability/metrics_exporter.py) renders the audit.v_*
# analyst views as Prometheus metrics, served at GET /metrics on the BFF
# (uvicorn src.api.main:app --port 8000). Point Prometheus at it:
#
#   prometheus --config.file=configs/monitoring/prometheus.yml
#
# Then load configs/monitoring/grafana_dashboard.json into Grafana and add this
# Prometheus as a data source. Alertmanager (optional) receives the alerts below.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: arag-xbrl

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: arag-xbrl
    metrics_path: /metrics
    static_configs:
      - targets:
          # Adjust to where the BFF is reachable from Prometheus. In the
          # WS-6/B7 docker-compose stack this is the api service DNS name.
          - localhost:8000
        labels:
          env: dev

# Optional — wire Alertmanager for paging. Left commented; alert rules still
# evaluate and show as PENDING/FIRING in the Prometheus UI without it.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['localhost:9093']
