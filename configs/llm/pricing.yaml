# --- DeepSeek: the deepseek profile. Official USD list prices (Models & Pricing page,
# retrieved 2026-10-29), PEAK rates (01:00-04:00 and 06:00-10:00 UTC on weekdays). Off-peak
# is half; it is not modelled, so the tracked cost is an upper bound and a cost cap is never
# understated. Cache hits are billed at cached_input; DeepSeek bills no cache writes.
deepseek-flash:      # $0.006 hit / $0.30 miss / $1.20 out per 1M
  input: 0.0003
  cached_input: 0.000006
  output: 0.0012
deepseek-v4-pro:     # $0.044 hit / $1.32 miss / $3.96 out per 1M
  input: 0.00132
  cached_input: 0.000044
  output: 0.00396

