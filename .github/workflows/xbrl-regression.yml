# WS-2 / B10 + A4 — live golden-set regression matrix + drift check.
#
# Heavier than the unit-test gate: runs the actual XBRL pipeline against the committed
# golden set, so it needs a reachable xbrl_db (Postgres + MVs), Qdrant, and an OpenAI
# key. Wired as manual (workflow_dispatch) only, rather than per-PR or scheduled, because
# of the LLM cost and backend requirements. Provisioning the DB / Qdrant / model
# services here is part of WS-6 / B7 (deployment); until then, run these commands from
# a dev box with the backends up.
name: XBRL regression & drift

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    # NOTE: expects xbrl_db (+ Qdrant) reachable and OPENAI_API_KEY in secrets.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XBRL_DB_HOST: ${{ secrets.XBRL_DB_HOST }}
      XBRL_DB_PORT: ${{ secrets.XBRL_DB_PORT }}
      XBRL_DB_NAME: ${{ secrets.XBRL_DB_NAME }}
      XBRL_DB_USER: ${{ secrets.XBRL_DB_USER }}
      XBRL_DB_PASSWORD: ${{ secrets.XBRL_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Regression matrix (fail on baseline accuracy < 0.8)
        run: python scripts/eval/run_regression_matrix.py --min-accuracy 0.8
      - name: Drift check vs baseline
        run: python scripts/eval/run_drift_check.py
