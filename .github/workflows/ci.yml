# WS-2 / B10 — always-on CI gate.
#
# Runs the unit suite on every push / PR. The unit tests are self-contained: the
# live-backend tests (Postgres / Qdrant / OpenAI) skip automatically when those are
# unreachable (see the `requires_db` / `requires_backends` / OPENAI_API_KEY guards),
# so this job is green without any secrets or services. The *live* golden-set
# regression matrix and drift check (scripts/eval/run_regression_matrix.py /
# run_drift_check.py) are heavier — they need a reachable xbrl_db + an API key — and
# run as the scheduled/dispatch job in xbrl-regression.yml once the deploy stack
# (WS-6 / B7) provides those services.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Coding standards: ruff, Google docstrings on changed lines, and the ratchet check
  # (burn-down list only shrinks; lint config and pins only tighten). ADVISORY for now
  # (continue-on-error): findings go to the job summary and never fail the workflow.
  # Actions are pinned to commit SHAs (version in the trailing comment); upgrade deliberately.
  standards:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the checks compare against the merge-base with origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned lint tooling
        run: pip install -r requirements-dev.txt
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: ruff check . --output-format github
      - name: New code (Google docstrings on changed lines)
        id: newcode
        continue-on-error: true
        # pipefail: the step outcome must be the checker's exit code, not tee's.
        shell: bash -eo pipefail {0}
        run: python tools/standards/check_standards.py new-code | tee newcode.txt
      - name: Ratchet
        id: ratchet
        continue-on-error: true
        shell: bash -eo pipefail {0}
        run: python tools/standards/check_standards.py ratchet | tee ratchet.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## Coding standards (advisory)"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| ruff | ${{ steps.ruff.outcome }} |"
            echo "| new code | ${{ steps.newcode.outcome }} |"
            echo "| ratchet | ${{ steps.ratchet.outcome }} |"
            for f in newcode.txt ratchet.txt; do
              if [ -s "$f" ]; then echo; echo "### $f"; echo '```'; head -100 "$f"; echo '```'; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # requirements-dev.txt: test_check_standards runs the pinned ruff.
        run: pip install -r requirements-test.txt
      - name: Unit tests
        env:
          HF_HUB_OFFLINE: "1"          # never download models in CI
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest test/unit -q
