# nginx config for the XbrlRag UI container (WS-6 / B7).
# Serves the built SPA and reverse-proxies API + metrics to the BFF, so the
# browser talks to a single origin (no CORS needed in the packaged stack).
# The `api` upstream name resolves via the compose/Helm service DNS.

upstream xbrlrag_api {
    server ${XBRLRAG_API_UPSTREAM};
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # BFF + v1 analyst API.
    location /api/ {
        proxy_pass http://xbrlrag_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Narrative reranking can be slow (listwise model on CPU). This MUST stay
        # above the app's own RAGINFER_TIMEOUT_S, or nginx cuts the connection first
        # and the browser sees a 504 while the API is still working — the inner
        # timeout should always fire before the outer one. Substituted by the nginx
        # entrypoint's envsubst, default set in ui/Dockerfile.
        proxy_read_timeout ${XBRLRAG_PROXY_READ_TIMEOUT}s;
    }

    # Prometheus scrape passthrough (optional convenience).
    location /metrics {
        proxy_pass http://xbrlrag_api;
        proxy_set_header Host $host;
    }
}
