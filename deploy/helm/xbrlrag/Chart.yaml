apiVersion: v2
name: xbrlrag
description: >-
  XbrlRag — XBRL RAG serving stack (WS-6/B7). Packages the BFF (api) + MCP server +
  React UI from the slim serving image. Postgres (xbrl_db) and Qdrant are treated
  as external managed services (configure their hosts in values.yaml); the shared
  RagInference service is reached via RAGINFER_URL.
