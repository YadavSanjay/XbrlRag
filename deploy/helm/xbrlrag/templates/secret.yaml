{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xbrlrag.fullname" . }}-secrets
  labels:
    {{- include "xbrlrag.labels" . | nindent 4 }}
type: Opaque
stringData:
  openaiApiKey: {{ .Values.secrets.openaiApiKey | quote }}
  jinaApiKey: {{ .Values.secrets.jinaApiKey | quote }}
  postgresPassword: {{ .Values.secrets.postgresPassword | quote }}
{{- end }}
