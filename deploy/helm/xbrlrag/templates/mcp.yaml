{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xbrlrag.fullname" . }}-mcp
  labels:
    {{- include "xbrlrag.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "xbrlrag.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      containers:
        - name: mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "src.mcp_server.server"]
          ports:
            - containerPort: {{ .Values.mcp.port }}
          env:
            - name: XBRLRAG_MCP_TRANSPORT
              value: streamable-http
            - name: XBRLRAG_MCP_PORT
              value: {{ .Values.mcp.port | quote }}
            {{- include "xbrlrag.appEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xbrlrag.fullname" . }}-mcp
  labels:
    {{- include "xbrlrag.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.mcp.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: {{ .Values.mcp.port }}
{{- end }}
