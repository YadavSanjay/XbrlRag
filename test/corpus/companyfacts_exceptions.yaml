# Facts that could not be compared because companyfacts has no entry for their own accession,
# counted per (ticker, accession, status). Also shrink-only: a count must match exactly; a
# higher count is a new gap to review, a lower one means the list must be edited down.
#   not_in_companyfacts   no entry for the concept, unit and period in any accession
#   other_accession_only  the value is filed only under an earlier accession (SEC de-duplication)
# TSM 0001628280-26-025362 (FY2025 20-F, filed 2026-04-16): the cached companyfacts carries only
# 2 dei entries for this accession, so SEC had not extracted its IFRS facts when the cache was
# taken. SEC-side/cache staleness; re-fetching companyfacts should clear it.
uncovered:
  - {ticker: TSM, accession_no: 0001628280-26-025362, status: not_in_companyfacts, count: 542}
  - {ticker: TSM, accession_no: 0001628280-26-025362, status: other_accession_only, count: 388}
